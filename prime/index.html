<script>
const BOT = "marketing_check_up_quiz_bot";
const PRIME_LINK = `https://t.me/${BOT}?start=prime`;
// База API (VPS). Витрина на GitHub Pages → fetch сюда (CORS на бэкенде).
// Постоянный адрес API: при следующей смене IP менять приложение не потребуется.
// Стандартный 443: порт 8443 режут VPN, публичный Wi-Fi и часть мобильных операторов.
// В боевой версии интерфейс и API живут на одном origin: без CORS-preflight.
// В локальном preview оставляем публичный API для диагностического экрана.
const API_BASE = location.hostname === 'api.juliana-loginova.ru'
  ? location.origin
  : "https://api.juliana-loginova.ru";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const INIT = tg ? tg.initData : "";
const app = document.getElementById('app');
const esc = s => (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;');
const jsq = s => JSON.stringify(String(s||''));
let STATE = null;
let currentAudioUrl = null;
let currentAudioElement = null;

async function api(path, opts){
  opts = opts || {};
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 12000);
  opts.headers = Object.assign({'Authorization':'tma '+INIT}, opts.headers||{});
  if(opts.body && !opts.headers['Content-Type']) opts.headers['Content-Type']='application/json';
  opts.signal = controller.signal;
  try{
    const r = await fetch(API_BASE + path, opts);
    return { status:r.status, data: r.status!==204 ? await r.json().catch(()=>null) : null };
  }catch(e){
    return { status:0, data:null };
  }finally{
    clearTimeout(timeout);
  }
}

async function apiBlob(path){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 30000);
  try{
    const r = await fetch(API_BASE + path, {
      headers:{'Authorization':'tma '+INIT}, signal:controller.signal
    });
    return {status:r.status, blob:r.status===200 ? await r.blob() : null};
  }catch(e){ return {status:0, blob:null}; }
  finally{ clearTimeout(timeout); }
}

function disposeAudio(){
  if(currentAudioElement){ currentAudioElement.pause(); currentAudioElement=null; }
  if(currentAudioUrl){ URL.revokeObjectURL(currentAudioUrl); currentAudioUrl=null; }
}

function formatAudioTime(value){
  if(!Number.isFinite(value)) return '0:00';
  const minutes=Math.floor(value/60), seconds=Math.floor(value%60);
  return `${minutes}:${String(seconds).padStart(2,'0')}`;
}

const AUDIO_SPEEDS=[1,1.5,2];
function getAudioSpeed(){
  const saved=Number(localStorage.getItem('audioSpeed'));
  return AUDIO_SPEEDS.includes(saved) ? saved : 1;
}
function setAudioSpeed(v){ try{ localStorage.setItem('audioSpeed',String(v)); }catch(e){} }

function mountAudioPlayer(url,n){
  const mount=document.getElementById('episodeAudioMount');
  if(!mount) return;
  mount.innerHTML=`<div class="audio-player">
    <audio preload="metadata" playsinline src="${url}"></audio>
    <button type="button" class="audio-toggle" aria-label="Воспроизвести аудиоурок эпизода ${n}"><span>▶</span></button>
    <div class="audio-console">
      <div class="audio-console-top"><span class="audio-status"><i></i> в эфире</span>
        <button type="button" class="audio-speed" aria-label="Скорость воспроизведения">1×</button></div>
      <div class="audio-wave" aria-hidden="true">${'<i></i>'.repeat(18)}</div>
      <input class="audio-seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Перемотка аудиоурока">
      <div class="audio-times"><span class="audio-current">0:00</span><span class="audio-duration">0:00</span></div>
    </div>
  </div>`;
  const player=mount.querySelector('.audio-player'), audio=player.querySelector('audio');
  const toggle=player.querySelector('.audio-toggle'), icon=toggle.querySelector('span');
  const seek=player.querySelector('.audio-seek'), current=player.querySelector('.audio-current');
  const duration=player.querySelector('.audio-duration');
  const speedBtn=player.querySelector('.audio-speed');
  currentAudioElement=audio;
  const applySpeed=v=>{ audio.playbackRate=v; speedBtn.textContent=(v===1?'1':v===1.5?'1.5':'2')+'×';
    speedBtn.setAttribute('aria-label','Скорость воспроизведения: '+v+'×'); };
  applySpeed(getAudioSpeed());
  speedBtn.addEventListener('click',()=>{
    const next=AUDIO_SPEEDS[(AUDIO_SPEEDS.indexOf(audio.playbackRate)+1)%AUDIO_SPEEDS.length];
    applySpeed(next); setAudioSpeed(next);
  });
  const sync=()=>{
    const progress=audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
    seek.value=String(progress); seek.style.setProperty('--progress',progress+'%');
    current.textContent=formatAudioTime(audio.currentTime);
  };
  audio.addEventListener('loadedmetadata',()=>{duration.textContent=formatAudioTime(audio.duration);applySpeed(getAudioSpeed());sync();});
  audio.addEventListener('timeupdate',sync);
  audio.addEventListener('play',()=>{player.classList.add('playing');icon.textContent='Ⅱ';toggle.setAttribute('aria-label','Поставить аудиоурок на паузу');});
  audio.addEventListener('pause',()=>{player.classList.remove('playing');icon.textContent='▶';toggle.setAttribute('aria-label','Продолжить аудиоурок');});
  audio.addEventListener('ended',()=>{audio.currentTime=0;sync();});
  toggle.addEventListener('click',()=>{ if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); });
  seek.addEventListener('input',()=>{ if(audio.duration) audio.currentTime=(Number(seek.value)/100)*audio.duration; });
  audio.load();
}

async function loadEpisodeAudio(n){
  const mount=document.getElementById('episodeAudioMount');
  if(!mount) return;
  mount.innerHTML='<div class="audio-loading"><i></i><span>Готовим эфир…</span></div>';
  const r=await apiBlob('/api/episode/'+n+'/audio');
  if(!document.getElementById('episodeAudioMount')) return;
  if(r.status!==200 || !r.blob){
    mount.innerHTML=`<button type="button" class="audio-retry" onclick="loadEpisodeAudio(${n})">Не удалось загрузить · повторить</button>`;
    return;
  }
  disposeAudio();
  currentAudioUrl=URL.createObjectURL(r.blob);
  mountAudioPlayer(currentAudioUrl,n);
}

function cardAbsoluteUrl(path){ return new URL(path, location.href).href; }

function closeCard(){
  const overlay=document.getElementById('cardOverlay');
  if(overlay) overlay.remove();
}

function openCard(path, n){
  closeCard();
  const overlay=document.createElement('div');
  overlay.id='cardOverlay';
  overlay.className='card-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label','Памятка к эпизоду '+n);
  overlay.innerHTML=`<div class="card-modal">
    <button type="button" class="card-close" onclick="closeCard()" aria-label="Закрыть памятку">×</button>
    <img src="${cardAbsoluteUrl(path)}" alt="Памятка к эпизоду ${n}">
    <div class="card-actions">
      <button type="button" class="cta" onclick='saveCard(${jsq(path)},${n},this)'>Сохранить памятку</button>
      <button type="button" class="cta ghost" onclick='openCardOriginal(${jsq(path)})'>Открыть оригинал</button>
    </div></div>`;
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeCard(); });
  document.body.appendChild(overlay);
}

function openCardOriginal(path){
  const url=cardAbsoluteUrl(path);
  if(tg&&tg.openLink) tg.openLink(url,{try_instant_view:false});
  else window.open(url,'_blank','noopener');
}

async function saveCard(path,n,btn){
  const original=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Готовлю файл…';}
  try{
    const response=await fetch(cardAbsoluteUrl(path));
    if(!response.ok) throw new Error('card_fetch_failed');
    const blob=await response.blob();
    const file=new File([blob],`pamjatka-epizod-${n}.png`,{type:blob.type||'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({
        files:[file], title:`Памятка к эпизоду ${n}`,
        text:`Эта памятка — часть приложения «Я в прайме». ${PRIME_LINK}`,
        url:PRIME_LINK
      });
    }else{
      const href=URL.createObjectURL(blob), link=document.createElement('a');
      link.href=href; link.download=file.name; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(href),1500);
    }
    if(btn) btn.textContent='Сохранено ✓';
  }catch(e){
    if(e&&e.name!=='AbortError') openCardOriginal(path);
    if(btn){btn.disabled=false;btn.textContent=original||'Сохранить памятку';}
  }
}

function brandline(right){

}
function tvWall(count, capOverride, subOverride){
  const caps = STATE.rating_caps, total=40, lit=Math.round((count/5)*total), pct=Math.round((count/5)*100);
  let cells=''; for(let i=0;i<total;i++) cells+=`<div class="tv ${i<lit?'on':''}"></div>`;
  return `<div class="wall-wrap">
    <div class="wall-top"><span class="lbl">// ваша узнаваемость</span>
      <span class="rating">${pct}% <small>эфира</small></span></div>
    <div class="tvgrid">${cells}</div>
    <div class="wall-cap">${esc(capOverride || caps[count])}<span class="cmt">${esc(subOverride || (count+' из 5 в эфире'))}</span></div>
  </div>`;
}

  // поэтому витрина одна и та же, меняются только подписи и нижний блок.

function showPaywall(){ app.innerHTML = renderPaywall(); setBackButton(true); window.scrollTo(0,0); }

const HOOK_TYPES={scene:'Сцена',number:'Цифра',dispute:'Спор',confession:'Признание'};
const ROUTES={message:'Написать в личные сообщения',link:'Перейти по ссылке',application:'Оставить заявку'};
const draftTimers={};
function attr(value){return esc(String(value||'')).replace(/"/g,'&quot;');}
function storedDraft(n){try{return JSON.parse(localStorage.getItem('primeDraft'+n)||'null');}catch(e){return null;}}
function episodePayload(e){
  const server=(e.submission&&e.submission.payload)||{};
  return Object.keys(server).length ? server : (storedDraft(e.n)||{});
}
function inputField(id,label,value,placeholder,max,area){
  const control=area
    ? `<textarea id="${id}" rows="3" maxlength="${max}" placeholder="${attr(placeholder)}" oninput="scheduleDraft(currentEpisode)">${esc(value||'')}</textarea>`
    : `<input id="${id}" type="text" maxlength="${max}" value="${attr(value||'')}" placeholder="${attr(placeholder)}" oninput="scheduleDraft(currentEpisode)">`;
  return `<label class="work-field"><span>${esc(label)}</span>${control}</label>`;
}
function renderWorkbook(e){
  const p=episodePayload(e);
  if(e.n===1) return `<section class="workbook"><div class="work-kicker">// ваша рабочая тетрадь</div>

    <p class="field-note" id="wordCount">Лучше уложиться в 15 слов. Допустимо от 5 до 25.</p></section>`;
  if(e.n===2) return `<section class="workbook"><div class="work-kicker">// один живой зритель</div>
    ${inputField('name_age','Как его зовут и сколько ему лет?',p.name_age,'Анна, 37 лет',80,false)}
    ${inputField('context','Где и когда он читает ваш блог?',p.context,'В метро по дороге домой',240,true)}
    ${inputField('pain','Что у него болит прямо сейчас?',p.pain,'Опишите конкретную ситуацию',400,true)}
    ${inputField('words','Как он сам об этом говорит?',p.words,'Живая фраза без профессиональных терминов',300,true)}</section>`;
  if(e.n===3){
    const hooks=Array.isArray(p.hooks)&&p.hooks.length===3?p.hooks:[{type:'scene',text:''},{type:'number',text:''},{type:'dispute',text:''}];
    return `<section class="workbook"><div class="work-kicker">// три разных захода</div>
      ${inputField('source','Как начинался последний пост? Можно пропустить',p.source,'Сегодня хочу рассказать...',500,true)}
      ${hooks.map((h,i)=>`<div class="hook-row"><label><span>Приём ${i+1}</span><select id="hookType${i}" onchange="scheduleDraft(currentEpisode)">${Object.entries(HOOK_TYPES).map(([v,l])=>`<option value="${v}" ${h.type===v?'selected':''}>${l}</option>`).join('')}</select></label>${inputField('hookText'+i,'Заход '+(i+1),h.text,'Первая фраза поста',300,true)}</div>`).join('')}
      <fieldset class="choice"><legend>Какой заход берёте в работу?</legend>${[1,2,3].map(n=>`<label><input type="radio" name="favorite" value="${n}" ${Number(p.favorite)===n?'checked':''} onchange="scheduleDraft(currentEpisode)"> ${n}</label>`).join('')}</fieldset></section>`;
  }
  if(e.n===4){const checks=new Set(p.checks||[]);return `<section class="workbook"><div class="work-kicker">// проверка первого кадра</div>
    <div class="checklist">${[['bio','В шапке есть понятная фраза и результат'],['pin','В закрепе понятен способ обратиться или купить'],['grid','Первые девять публикаций поддерживают главную тему']].map(([v,l])=>`<label><input type="checkbox" value="${v}" ${checks.has(v)?'checked':''} onchange="scheduleDraft(currentEpisode)"><span>${l}</span></label>`).join('')}</div>
    ${inputField('changes','Что именно вы изменили сегодня?',p.changes,'Коротко перечислите изменения',500,true)}
    <p class="field-note">Пока не всё готово? Черновик сохранится, можно вернуться позже.</p></section>`;}
  const items=Array.isArray(p.items)&&p.items.length===8?p.items:Array.from({length:8},()=>({topic:'',teaser:''}));
  return `<section class="workbook"><div class="work-kicker">// сетка из восьми публикаций</div>
    <label class="work-field"><span>Куда ведём читателя?</span><select id="route" onchange="scheduleDraft(currentEpisode)">${Object.entries(ROUTES).map(([v,l])=>`<option value="${v}" ${p.route===v?'selected':''}>${l}</option>`).join('')}</select></label>
    ${inputField('action','Что именно он должен сделать?',p.action,'Например: написать слово ПРАЙМ',180,false)}
    <div class="grid-progress" id="gridProgress">Готово 0 из 8</div>
    ${items.map((item,i)=>`<div class="plan-row"><b>${i+1}</b><div>${inputField('topic'+i,'Тема публикации',item.topic,'Тема '+(i+1),140,false)}${inputField('teaser'+i,'Зачем вернуться к следующей?',item.teaser,'Одна строка анонса',180,false)}</div></div>`).join('')}</section>`;
}
function collectSubmission(n){
  const value=id=>(document.getElementById(id)||{}).value||'';
  if(n===1)return {audience:value('audience'),change:value('change'),logline:value('logline')};
  if(n===2)return {name_age:value('name_age'),context:value('context'),pain:value('pain'),words:value('words')};
  if(n===3)return {source:value('source'),hooks:[0,1,2].map(i=>({type:value('hookType'+i),text:value('hookText'+i)})),favorite:Number((document.querySelector('input[name="favorite"]:checked')||{}).value||0)};
  if(n===4)return {checks:Array.from(document.querySelectorAll('.checklist input:checked')).map(x=>x.value),changes:value('changes')};
  return {route:value('route'),action:value('action'),items:Array.from({length:8},(_,i)=>({topic:value('topic'+i),teaser:value('teaser'+i)}))};
}
function refreshWorkbookHints(){
  if(currentEpisode===1){const el=document.getElementById('wordCount'),v=document.getElementById('logline');if(el&&v){const n=v.value.trim()?v.value.trim().split(/\s+/).length:0;el.textContent=`Сейчас ${n} слов. Лучше до 15, допустимо от 5 до 25.`;}}
  if(currentEpisode===5){const el=document.getElementById('gridProgress');if(el){const p=collectSubmission(5);el.textContent=`Готово ${p.items.filter(x=>x.topic.trim()&&x.teaser.trim()).length} из 8`;}}
}
function scheduleDraft(n){
  refreshWorkbookHints(); clearTimeout(draftTimers[n]);
  draftTimers[n]=setTimeout(()=>saveDraft(n),800);
}
async function saveDraft(n){
  const payload=collectSubmission(n);try{localStorage.setItem('primeDraft'+n,JSON.stringify(payload));}catch(e){}
  await api('/api/episode/'+n+'/submission',{method:'PUT',body:JSON.stringify(payload)});
}
function completedCard(e){
  const p=episodePayload(e);let main='Результат сохранён.';
  if(e.n===1)main='«'+esc(p.logline||'Фраза сохранена')+'»';
  if(e.n===2)main=esc(p.name_age||'Портрет зрителя сохранён');
  if(e.n===3&&p.hooks)main=esc((p.hooks[(Number(p.favorite)||1)-1]||{}).text||'Три захода сохранены');
  if(e.n===4)main=esc(p.changes||'Изменения профиля сохранены');
  if(e.n===5)main='Восемь тем сохранены. Основа сезона собрана.';
  return `<div class="saved-result"><div class="work-kicker">// сохранено</div><p>${main}</p></div>`;
}
function nextButton(e){
  if(!STATE.paid&&e.n===1)return `<button class="cta" onclick="buy()">Открыть эпизоды 2–5</button>`;
  if(e.n<5)return `<button class="cta" onclick="openEp(${e.n+1})">Перейти к эпизоду ${e.n+1}</button>`;
  return `<button class="cta" onclick="showFinal()">Смотреть финал</button>`;
}
let currentEpisode=0;
function renderEp(e){
  currentEpisode=e.n;
  return `<div class="screen on stag">
    <button class="back-link" onclick="showDash()" aria-label="Назад к списку эпизодов">← Назад к эпизодам</button>
    ${brandline('эпизод '+e.n+' из 5')}
    <div class="ep-head prose">
      <div class="ep-kicker">// эпизод ${e.n} · ${esc(e.tag)}</div>
      <h1 class="ep-title">${esc(e.title)}</h1>
    </div>
    ${e.audio?`<section class="episode-audio" aria-label="Аудиоурок эпизода">
      <div class="audio-brand"><span class="audio-kicker">// голос режиссёра</span><span class="audio-chip">премьера</span></div>
      <div class="audio-heading">Сначала — <span>голосом</span></div>
      <div class="audio-byline">Юлиана Логинова · авторский разбор</div>
      <div id="episodeAudioMount" class="audio-mount" aria-live="polite"><div class="audio-loading"><i></i><span>Готовим эфир…</span></div></div>
    </section>`:''}
    <div class="prose">
      <p>${esc(STATE.name)||'Привет'}, привет!</p>
      ${(e.prose||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
      ${e.list&&e.list.length?`<ul class="list">${e.list.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
      ${(e.after||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
      ${e.sting?`<p class="sting">${esc(e.sting)}</p>`:''}
      ${e.next?`<p class="cmt" style="margin-top:14px">// ${esc(e.next)}</p>`:''}
    </div>
    ${e.card?`<figure class="cardshot">
      <button type="button" class="card-preview" onclick='openCard(${jsq(e.card)},${e.n})' aria-label="Открыть памятку к эпизоду ${e.n}">
        <img src="${esc(e.card)}" alt="Памятка к эпизоду ${e.n}" loading="lazy">
      </button>
      <figcaption>Нажмите на памятку, чтобы открыть её в полном размере.</figcaption>
      <button type="button" class="card-save" onclick='saveCard(${jsq(e.card)},${e.n},this)'>Сохранить памятку ↓</button>
    </figure>`:''}
    <div class="prose">
      <div class="taskcard"><div class="th">▶ Задание · 15 минут</div>${esc(e.task)}</div>
      ${renderWorkbook(e)}
      ${e.submit?`<div class="submitcard">
        <div class="sub-h">на разбор</div>
        <p>${esc(e.submit)}</p>
        ${e.submit_promise?`<p class="sub-promise">${esc(e.submit_promise)}</p>`:''}
      </div>`:''}
    </div>
    ${ STATE.feedback && STATE.feedback.cta ? (STATE.paid
      ? `<div class="fb-up">
      <button class="cta gold" onclick="feedbackReview(${e.n})">${esc((STATE.feedback.cta||'').replace('{n}', e.n))}</button>
      <p class="price-note">${esc(STATE.feedback.note||'')}</p></div>`
      : `<div class="fb-up">
      <p class="price-note">Голосовой разбор задания я записываю участникам «Я в прайме».</p>
      <button class="cta ghost" onclick="showPaywall()">Открыть остальные эпизоды</button></div>`) : '' }
    ${ e.done
      ? `${completedCard(e)}<div class="navrow"><button class="cta ghost" onclick="showDash()">К сезону</button>${nextButton(e)}</div>`
      : `<div style="height:20px"></div><button class="cta" id="doneBtn" onclick="complete(${e.n})">Сохранить результат</button><button class="return-later" onclick="showDash()">Вернуться позже</button>` }
  </div>`;
}

function sessionOffer(o){
  if(!o) return '';
  const name = esc(STATE.name) || 'Привет';
  const pr = STATE.session_price || {};
  // Классы те же, что у paywall: финал не должен выглядеть чужим экраном.
  // Сначала человек читает свою ситуацию, и только потом видит название сессии:
  // предложение должно приходить как ответ на уже названную боль.
  return `<div class="offer">
    <div class="eyebrow">${esc(o.eyebrow)}</div>
    <p class="offer-lead">${esc(o.pain)}</p>
    ${STATE.diagnosis?`<p class="diag">${esc(STATE.diagnosis)}</p>`:''}
    <h2 class="offer-h">${esc(o.title_top)}<span class="red">${esc(o.title_red)}</span></h2>
    <p class="offer-sub">${esc(o.subtitle)}</p>
    <p class="sell-promise">${esc(o.promise)}</p>
    <div class="sell-h">${esc(o.get_title)}</div>
    <ul class="get-list">${(o.get||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
    <div class="after-card">
      <div class="after-h">${esc(o.after_title)}</div>
      <ul>${(o.after||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
    </div>
    <div class="not-card">
      <div class="not-h">${esc(o.not_title)}</div>
      <ul>${(o.not_list||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
    </div>
    <figure class="who">
      <img src="img/juliana.jpg" alt="Юлиана Логинова" loading="lazy">
      <figcaption>Юлиана Логинова <span>${esc(o.photo_caption)}</span></figcaption>
    </figure>
    <div class="proof-card"><div class="proof-h">${esc(o.proof_title)}</div>${esc(o.proof)}</div>
    <div class="ticket">
      <div class="ticket-price">
        <span class="price-num">${(pr.rub||9900).toLocaleString('ru-RU')} ₽</span>
        ${pr.early?`<span class="price-was">${(pr.full_rub||12900).toLocaleString('ru-RU')} ₽</span>`:''}
      </div>
      <p class="ticket-what">${esc(o.price_what)}</p>
      ${pr.early&&pr.deadline?`<div class="ticket-cd" id="countdown" data-deadline="${esc(pr.deadline)}">
        <span class="cd-label">цена участника действует ещё</span>
        <span class="cd-time">—</span></div>`:''}
      <button class="ticket-cta" onclick="session()">${esc(o.cta)}</button>
      <p class="ticket-note">${esc(o.cta_note)}</p>
    </div>
  </div>`;
}

let countdownTimer = null;
function startCountdown(){
  clearInterval(countdownTimer);
  const box = document.getElementById('countdown');
  if(!box) return;
  const deadline = new Date(box.dataset.deadline).getTime();
  const out = box.querySelector('.cd-time');
  const tick = () => {
    const left = deadline - Date.now();
    if(left <= 0){                       // окно закрылось — берём у сервера новую цену
      clearInterval(countdownTimer);
      boot();
      return;
    }
    const d = Math.floor(left/86400000), h = Math.floor(left/3600000)%24;
    const m = Math.floor(left/60000)%60, sec = Math.floor(left/1000)%60;
    const pad = n => String(n).padStart(2,'0');
    out.textContent = (d?d+' д ':'') + pad(h)+':'+pad(m)+':'+pad(sec);
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function renderFinal(){
  const f = STATE.final;
  return `<div class="screen on stag">
    <button class="back-link" onclick="showDash()" aria-label="Назад к списку эпизодов">← Назад к эпизодам</button>
    ${brandline('финал сезона')}
    <div class="final-badge">${esc(f.badge)}</div>
    <h1 class="lead">${esc(f.title_top)}<span class="red">${esc(f.title_red)}</span></h1>
    ${tvWall(5)}
    <p style="margin:18px 0">${esc(f.body)}</p>
    ${sessionOffer(f.session)}
  </div>`;
}

// ---- переходы ----
function setBackButton(visible){
  if(!tg || !tg.BackButton) return;
  if(visible) tg.BackButton.show(); else tg.BackButton.hide();
}
function showDash(){ disposeAudio(); app.innerHTML = renderDash(); setBackButton(false); window.scrollTo(0,0); }
function showFinal(){ disposeAudio(); app.innerHTML = renderFinal(); startCountdown();
  // Отмечаем показ оффера: по этой отметке бот перестаёт звать вернуться
  // и начинает напоминать про срок цены участника.
  api('/api/offer-seen', {method:'POST'}); setBackButton(true); window.scrollTo(0,0); }
async function openEp(n){
  let r = await api('/api/episode/'+n);
  // Мобильный WebView иногда роняет самый первый запрос после клика молча,
  // без кода ошибки. Один тихий повтор чинит это, не тревожа человека алертом.
  if(r.status===0){ await new Promise(res=>setTimeout(res,600)); r = await api('/api/episode/'+n); }
  if(r.status===402){ STATE.paid=false; showPaywall(); return; }
  if(r.status===403){ tgAlert('Сначала сохраните результат предыдущего эпизода.'); return; }
  if(r.status!==200){ tgAlert('Не удалось открыть эпизод. Проверьте связь и попробуйте ещё раз.'); return; }
  disposeAudio(); app.innerHTML = renderEp(r.data); setBackButton(true); window.scrollTo(0,0);
  refreshWorkbookHints();
  if(r.data.audio) loadEpisodeAudio(n);
}
function celebrateWall(prev, cur){
  const total=40, prevLit=Math.round((prev/5)*total), curLit=Math.round((cur/5)*total);
  let cells=''; for(let i=0;i<total;i++){
    if(i<prevLit) cells+=`<div class="tv on"></div>`;
    else if(i<curLit) cells+=`<div class="tv on lightup" style="animation-delay:${((i-prevLit)*0.05).toFixed(2)}s"></div>`;
    else cells+=`<div class="tv"></div>`;
  }
  const pct=Math.round((cur/5)*100);
  return `<div class="wall-wrap"><div class="wall-top"><span class="lbl">// ваша узнаваемость</span>
    <span class="rating">${pct}% <small>эфира</small></span></div><div class="tvgrid">${cells}</div></div>`;
}
function renderCelebrate(ep, prev, cur){
  const isFinal = ep>=5, badge = (STATE.episodes.find(e=>e.n===ep)||{}).badge || '';
  // Человек только что получил результат бесплатного эпизода. Здесь он решает,
  // идти ли дальше, поэтому вместо «Дальше» стоит предложение остальных эпизодов.
  const free = !STATE.paid;
  const p = STATE.paywall;
  return `<div class="screen on"><div class="celebrate">
    <div class="cel-cap">${isFinal?'// премьера':'// эпизод '+ep+' в эфире'}</div>
    ${celebrateWall(prev, cur)}
    <div class="cel-badge">${esc(badge)}</div>
    <p class="cel-line">${esc(STATE.rating_caps[cur]||'')}</p>
    ${free?`<p class="cel-line" style="font-size:.86rem;opacity:.85">Заявка готова. Дальше зритель, заходы, профиль и план на месяц.</p>
      <button class="cta" onclick="buy()">${esc(p.cta)}</button>
      <button class="cta ghost" style="margin-top:10px" onclick="showPaywall()">Сначала посмотреть, что внутри</button>`
      :`<button class="cta" onclick="${isFinal?'showFinal()':'showDash()'}">${isFinal?'Смотреть финал':'Дальше'}</button>`}
  </div></div>`;
}
async function complete(n){
  const btn=document.getElementById('doneBtn'); if(btn){btn.disabled=true;btn.textContent='Сохраняю…';}
  const payload=collectSubmission(n);
  const r = await api('/api/episode/'+n+'/complete',{method:'POST',body:JSON.stringify(payload)});
  if(r.status===200){ STATE=r.data;try{localStorage.removeItem('primeDraft'+n);}catch(e){}
    if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); await openEp(n); }
  else { if(btn){btn.disabled=false;btn.textContent='Сохранить результат';}
    const detail=r.data&&r.data.detail;const field=detail&&detail.field;
    tgAlert(field?'Проверьте заполнение поля «'+field+'».':'Заполните все поля задания и попробуйте ещё раз.'); }
}
// Счета и оплату выставляет бот (см. PAYMENT-SPEC), поэтому часть кнопок уводит в чат.
// Telegram переключает экран не всегда: без этого объяснения человек слышит уведомление
// и не понимает, что произошло, поэтому приложение сначала показывает, куда его ведут.
function handoff(url, title, body, cta, sent){
  disposeAudio();
  app.innerHTML = `<div class="screen on stag">
    ${brandline('следующий шаг — в Telegram')}
    <div class="eyebrow">// сначала всё объясним</div>
    <h1 class="lead">${esc(title)}</h1>
    <div class="handoff-note" id="handoffStatus" role="status" aria-live="polite">
      <b>Что произойдёт дальше</b>
      <span>${esc(body)}</span>
    </div>
    <div style="height:18px"></div>
    <button class="cta" id="handoffBtn" onclick='openHandoff(${jsq(url)},${jsq(sent)},this)'>${esc(cta||'Открыть чат с ботом')} ↗</button>
    <button class="cta ghost" style="margin-top:10px" onclick="showDash()">Вернуться к эпизодам</button>
  </div>`;
  setBackButton(true);
  window.scrollTo(0,0);
}
function openHandoff(url, sent, btn){
  if(btn){btn.disabled=true;btn.textContent='Открываю Telegram…';}
  const status=document.getElementById('handoffStatus');
  if(status){
    status.classList.add('sent');
    status.innerHTML=`<b>Команда отправляется в бот ✓</b><span>${esc(sent)}</span>`;
  }
  setTimeout(()=>{
    if(tg&&tg.openTelegramLink) tg.openTelegramLink(url);
    else location.href=url;
    setTimeout(()=>{if(btn){btn.disabled=false;btn.textContent='Открыть чат ещё раз ↗';}},1200);
  },180);
}
function buy(){
  handoff(`https://t.me/${BOT}?start=buy_challenge`, 'Оплата продолжается в чате с ботом',
    'После нажатия бот пришлёт счёт на 1490 ₽. После оплаты следующий эпизод откроется сразу после задания или автоматически через сутки.',
    'Получить счёт в боте', 'Бот сейчас пришлёт счёт на 1490 ₽. Если чат не открылся, нажмите кнопку ещё раз.');
}
function promo(){
  handoff(`https://t.me/${BOT}?start=prime_test`, 'Промокод вводится в чате',
    'После нажатия откроется бот. Отправьте ему код одним сообщением по формату /promo ВАШКОД.',
    'Ввести промокод в боте', 'Бот сейчас откроет ввод промокода. Если чат не открылся, нажмите кнопку ещё раз.');
}
function checkup(){
  handoff(`https://t.me/${BOT}?start=checkup`, 'Подробности придут в чат с ботом',
    'После нажатия бот пришлёт описание и следующий шаг.',
    'Получить подробности в боте', 'Бот сейчас пришлёт подробности. Если чат не открылся, нажмите кнопку ещё раз.');
}
function session(){
  handoff(`https://t.me/${BOT}?start=session`, 'Запись продолжается в чате с ботом',
    'После нажатия бот покажет свободные слоты и поможет подтвердить время.',
    'Посмотреть свободные слоты', 'Бот сейчас покажет свободные слоты. Если чат не открылся, нажмите кнопку ещё раз.');
}
function feedbackReview(n){
  handoff(`https://t.me/${BOT}?start=fb_${n}`, 'Разбор оформляется в чате с ботом',
    `После нажатия бот пришлёт счёт за разбор эпизода ${n}. После оплаты вы отправите работу туда же.`,
    'Получить счёт на разбор', `Бот сейчас пришлёт счёт за разбор эпизода ${n}. Если чат не открылся, нажмите кнопку ещё раз.`);
}
function tgAlert(m){ if(tg&&tg.showAlert){ tg.showAlert(m); } else { alert(m); } }

// ---- старт ----
async function boot(){
  try{ if(tg){ tg.ready(); tg.expand(); if(tg.BackButton){ tg.BackButton.onClick(showDash); } } }catch(e){}
  if(!INIT){ screenBoot('Откройте приложение через бота @'+BOT+' — первый эпизод открыт всем.', false); return; }
  const r = await api('/api/state');
  if(r.status===401){ screenBoot('Сессия не подтвердилась. Откройте приложение заново через бота.', false); return; }
  if(r.status!==200 || !r.data){ screenBoot('Сервис временно недоступен. Попробуйте чуть позже.', false); return; }
  STATE = r.data;
  showDash();
}
boot();
</script>
