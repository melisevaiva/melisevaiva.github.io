<script>
// Старые кнопки бота ведут на GitHub Pages. Сразу переводим их на единый домен
// приложения и API, сохраняя Telegram WebApp-параметры из hash.
if (location.hostname !== 'api.juliana-loginova.ru') {
  const target = new URL('https://api.juliana-loginova.ru/');
  target.searchParams.set('v', '20260902-1');
  target.hash = location.hash;
  location.replace(target.toString());
}
</script>

<script>
const BOT = "marketing_check_up_quiz_bot";
const PRIME_LINK = `https://t.me/${BOT}?start=prime`;
// База API (VPS). Витрина на GitHub Pages → fetch сюда (CORS на бэкенде).
// Постоянный адрес API: при следующей смене IP менять приложение не потребуется.
// Стандартный 443: порт 8443 режут VPN, публичный Wi-Fi и часть мобильных операторов.
// В боевой версии интерфейс и API живут на одном origin: без CORS-preflight.
// В локальном preview оставляем публичный API для диагностического экрана.
const API_BASE = location.hostname === 'api.juliana-loginova.ru'
  ? location.origin
  : "https://api.juliana-loginova.ru";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const INIT = tg ? tg.initData : "";
const app = document.getElementById('app');
const esc = s => (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;');
const jsq = s => JSON.stringify(String(s||''));
let STATE = null;
let currentAudioUrl = null;
let currentAudioElement = null;

async function api(path, opts){
  opts = opts || {};
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 12000);
  opts.headers = Object.assign({'Authorization':'tma '+INIT}, opts.headers||{});
  opts.signal = controller.signal;
  try{
    const r = await fetch(API_BASE + path, opts);
    return { status:r.status, data: r.status!==204 ? await r.json().catch(()=>null) : null };
  }catch(e){
    return { status:0, data:null };
  }finally{
    clearTimeout(timeout);
  }
}

async function apiBlob(path){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 30000);
  try{
    const r = await fetch(API_BASE + path, {
      headers:{'Authorization':'tma '+INIT}, signal:controller.signal
    });
    return {status:r.status, blob:r.status===200 ? await r.blob() : null};
  }catch(e){ return {status:0, blob:null}; }
  finally{ clearTimeout(timeout); }
}

function disposeAudio(){
  if(currentAudioElement){ currentAudioElement.pause(); currentAudioElement=null; }
  if(currentAudioUrl){ URL.revokeObjectURL(currentAudioUrl); currentAudioUrl=null; }
}

function formatAudioTime(value){
  if(!Number.isFinite(value)) return '0:00';
  const minutes=Math.floor(value/60), seconds=Math.floor(value%60);
  return `${minutes}:${String(seconds).padStart(2,'0')}`;
}

const AUDIO_SPEEDS=[1,1.5,2];
function getAudioSpeed(){
  const saved=Number(localStorage.getItem('audioSpeed'));
  return AUDIO_SPEEDS.includes(saved) ? saved : 1;
}
function setAudioSpeed(v){ try{ localStorage.setItem('audioSpeed',String(v)); }catch(e){} }

function mountAudioPlayer(url,n){
  const mount=document.getElementById('episodeAudioMount');
  if(!mount) return;
  mount.innerHTML=`<div class="audio-player">
    <audio preload="metadata" playsinline src="${url}"></audio>
    <button type="button" class="audio-toggle" aria-label="Воспроизвести аудиоурок эпизода ${n}"><span>▶</span></button>
    <div class="audio-console">
      <div class="audio-console-top"><span class="audio-status"><i></i> в эфире</span>
        <button type="button" class="audio-speed" aria-label="Скорость воспроизведения">1×</button></div>
      <div class="audio-wave" aria-hidden="true">${'<i></i>'.repeat(18)}</div>
      <input class="audio-seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Перемотка аудиоурока">
      <div class="audio-times"><span class="audio-current">0:00</span><span class="audio-duration">0:00</span></div>
    </div>
  </div>`;
  const player=mount.querySelector('.audio-player'), audio=player.querySelector('audio');
  const toggle=player.querySelector('.audio-toggle'), icon=toggle.querySelector('span');
  const seek=player.querySelector('.audio-seek'), current=player.querySelector('.audio-current');
  const duration=player.querySelector('.audio-duration');
  const speedBtn=player.querySelector('.audio-speed');
  currentAudioElement=audio;
  const applySpeed=v=>{ audio.playbackRate=v; speedBtn.textContent=(v===1?'1':v===1.5?'1.5':'2')+'×';
    speedBtn.setAttribute('aria-label','Скорость воспроизведения: '+v+'×'); };
  applySpeed(getAudioSpeed());
  speedBtn.addEventListener('click',()=>{
    const next=AUDIO_SPEEDS[(AUDIO_SPEEDS.indexOf(audio.playbackRate)+1)%AUDIO_SPEEDS.length];
    applySpeed(next); setAudioSpeed(next);
  });
  const sync=()=>{
    const progress=audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
    seek.value=String(progress); seek.style.setProperty('--progress',progress+'%');
    current.textContent=formatAudioTime(audio.currentTime);
  };
  audio.addEventListener('loadedmetadata',()=>{duration.textContent=formatAudioTime(audio.duration);applySpeed(getAudioSpeed());sync();});
  audio.addEventListener('timeupdate',sync);
  audio.addEventListener('play',()=>{player.classList.add('playing');icon.textContent='Ⅱ';toggle.setAttribute('aria-label','Поставить аудиоурок на паузу');});
  audio.addEventListener('pause',()=>{player.classList.remove('playing');icon.textContent='▶';toggle.setAttribute('aria-label','Продолжить аудиоурок');});
  audio.addEventListener('ended',()=>{audio.currentTime=0;sync();});
  toggle.addEventListener('click',()=>{ if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); });
  seek.addEventListener('input',()=>{ if(audio.duration) audio.currentTime=(Number(seek.value)/100)*audio.duration; });
  audio.load();
}

async function loadEpisodeAudio(n){
  const mount=document.getElementById('episodeAudioMount');
  if(!mount) return;
  mount.innerHTML='<div class="audio-loading"><i></i><span>Готовим эфир…</span></div>';
  const r=await apiBlob('/api/episode/'+n+'/audio');
  if(!document.getElementById('episodeAudioMount')) return;
  if(r.status!==200 || !r.blob){
    mount.innerHTML=`<button type="button" class="audio-retry" onclick="loadEpisodeAudio(${n})">Не удалось загрузить · повторить</button>`;
    return;
  }
  disposeAudio();
  currentAudioUrl=URL.createObjectURL(r.blob);
  mountAudioPlayer(currentAudioUrl,n);
}

function cardAbsoluteUrl(path){ return new URL(path, location.href).href; }

function closeCard(){
  const overlay=document.getElementById('cardOverlay');
  if(overlay) overlay.remove();
}

function openCard(path, n){
  closeCard();
  const overlay=document.createElement('div');
  overlay.id='cardOverlay';
  overlay.className='card-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label','Памятка к эпизоду '+n);
  overlay.innerHTML=`<div class="card-modal">
    <button type="button" class="card-close" onclick="closeCard()" aria-label="Закрыть памятку">×</button>
    <img src="${cardAbsoluteUrl(path)}" alt="Памятка к эпизоду ${n}">
    <div class="card-actions">
      <button type="button" class="cta" onclick='saveCard(${jsq(path)},${n},this)'>Сохранить памятку</button>
      <button type="button" class="cta ghost" onclick='openCardOriginal(${jsq(path)})'>Открыть оригинал</button>
    </div></div>`;
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeCard(); });
  document.body.appendChild(overlay);
}

function openCardOriginal(path){
  const url=cardAbsoluteUrl(path);
  if(tg&&tg.openLink) tg.openLink(url,{try_instant_view:false});
  else window.open(url,'_blank','noopener');
}

function openPrimeLink(){
  if(tg&&tg.openTelegramLink) tg.openTelegramLink(PRIME_LINK);
  else window.open(PRIME_LINK,'_blank','noopener');
}

async function saveCard(path,n,btn){
  const original=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Готовлю файл…';}
  try{
    const response=await fetch(cardAbsoluteUrl(path));
    if(!response.ok) throw new Error('card_fetch_failed');
    const blob=await response.blob();
    const file=new File([blob],`pamjatka-epizod-${n}.png`,{type:blob.type||'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({
        files:[file], title:`Памятка к эпизоду ${n}`,
        text:`Эта памятка — часть приложения «Я в прайме». ${PRIME_LINK}`,
        url:PRIME_LINK
      });
    }else{
      const href=URL.createObjectURL(blob), link=document.createElement('a');
      link.href=href; link.download=file.name; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(href),1500);
    }
    if(btn) btn.textContent='Сохранено ✓';
  }catch(e){
    if(e&&e.name!=='AbortError') openCardOriginal(path);
    if(btn){btn.disabled=false;btn.textContent=original||'Сохранить памятку';}
  }
}

function brandline(right){
  return `<div class="brandline"><div class="mark">Ю</div>
    <div><div class="u" style="font-size:.72rem;letter-spacing:.04em">Юлиана Логинова</div></div>
    <div class="cmt">// ${right||'я в прайме'}</div></div>`;
}
function tvWall(count, capOverride, subOverride){
  const caps = STATE.rating_caps, total=40, lit=Math.round((count/5)*total), pct=Math.round((count/5)*100);
  let cells=''; for(let i=0;i<total;i++) cells+=`<div class="tv ${i<lit?'on':''}"></div>`;
  return `<div class="wall-wrap">
    <div class="wall-top"><span class="lbl">// ваша узнаваемость</span>
      <span class="rating">${pct}% <small>эфира</small></span></div>
    <div class="tvgrid">${cells}</div>
    <div class="wall-cap">${esc(capOverride || caps[count])}<span class="cmt">${esc(subOverride || (count+' из 5 в эфире'))}</span></div>
  </div>`;
}

function renderDash(){
  const done = new Set(STATE.progress.map(p=>p.day));
  const unlocked = STATE.unlocked_day, rec = STATE.recognition;
  // Эпизод 1 открыт всем. У неоплатившего замки 2-5 ведут на продающий экран,
  // поэтому витрина одна и та же, меняются только подписи и нижний блок.
  const free = !STATE.paid;
  const p = STATE.paywall;
  return `<div class="screen on stag">
    ${brandline(free?'первый эпизод открыт':'добро пожаловать на кастинг')}
    <div class="eyebrow">// ${free?'эпизод 1 из 5 · бесплатно':'кастинг · '+(rec>=5?'финал':'этап '+(Math.min(unlocked,5))+' из 5')}</div>
    <h1 class="lead">${esc(STATE.name)||'Привет'}, <span class="red">${free?'начнём с заявки':'вас начинают замечать'}</span></h1>
    ${tvWall(rec)}
    ${free?`<p class="sell-reassure" style="margin:12px 0 0;font-size:.82rem">Первый эпизод занимает 15 минут. Остальные четыре открываются после оплаты.</p>`
          :(rec<5?`<p class="sell-reassure" style="margin:12px 0 0;font-size:.82rem">Новый эпизод открывается каждый день — заходите утром.</p>`:'')}
    <div style="height:8px"></div>
    ${STATE.episodes.map(e=>{
      const st = done.has(e.n) ? 'done' : (e.n<=unlocked ? 'now' : 'lock');
      let flag = st==='done'?'в эфире ✓':(st==='now'?'открыт':(free?'1490 ₽':(e.n===unlocked+1?'завтра':'🔒')));
      if(st!=='lock' || free) flag += ' ›';
      const badge = st==='done' ? `<div class="badge-chip">${esc(e.badge)}</div>`:'';
      const click = st!=='lock' ? `onclick="openEp(${e.n})"` : (free ? 'onclick="showPaywall()"' : 'disabled');
      return `<button type="button" class="stage ${st}" ${click}>
        <div class="snum">${e.n}</div>
        <div><div class="stagehead"><div class="stitle">${esc(e.tag)}</div></div>
          <div class="sdesc">${esc(e.title)}</div>${badge}</div>
        <div class="sflag">${flag}</div></button>`;
    }).join('')}
    ${free?`<div style="height:18px"></div>
      <button class="cta ghost" onclick="showPaywall()">Что в остальных четырёх эпизодах</button>
      <div class="sticky-cta"><button class="cta" onclick="buy()">${esc(p.cta)}</button>
        <span class="sc-note">${esc(p.cta_reassure||p.cta_note||'')}</span></div>`
      :((rec>=5||unlocked>=5)?`<div style="height:18px"></div><button class="cta" onclick="showFinal()">Смотреть финал</button>`:'')}
  </div>`;
}

function showPaywall(){ app.innerHTML = renderPaywall(); setBackButton(true); window.scrollTo(0,0); }

    ${ STATE.feedback && STATE.feedback.cta ? (STATE.paid
      ? `<div class="fb-up">

    ${pr.early&&pr.deadline?`<div class="countdown" id="countdown" data-deadline="${esc(pr.deadline)}">
      <span class="cd-label">цена участника действует ещё</span>
      <span class="cd-time">—</span></div>`:''}
    <button class="cta gold" onclick="session()">${esc(o.cta)}</button>
    <p class="sc-note" style="margin-top:10px;text-align:center">${esc(o.cta_note)}</p>
  </div>`;
}

let countdownTimer = null;
function startCountdown(){
  clearInterval(countdownTimer);
  const box = document.getElementById('countdown');
  if(!box) return;
  const deadline = new Date(box.dataset.deadline).getTime();
  const out = box.querySelector('.cd-time');
  const tick = () => {
    const left = deadline - Date.now();
    if(left <= 0){                       // окно закрылось — берём у сервера новую цену
      clearInterval(countdownTimer);
      boot();
      return;
    }
    const d = Math.floor(left/86400000), h = Math.floor(left/3600000)%24;
    const m = Math.floor(left/60000)%60, sec = Math.floor(left/1000)%60;
    const pad = n => String(n).padStart(2,'0');
    out.textContent = (d?d+' д ':'') + pad(h)+':'+pad(m)+':'+pad(sec);
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function renderFinal(){
  const f = STATE.final;
  return `<div class="screen on stag">
    <button class="back-link" onclick="showDash()" aria-label="Назад к списку эпизодов">← Назад к эпизодам</button>
    ${brandline('финал сезона')}
    <div class="final-badge">${esc(f.badge)}</div>
    <h1 class="lead">${esc(f.title_top)}<span class="red">${esc(f.title_red)}</span></h1>
    ${tvWall(5)}
    <p style="margin:18px 0">${esc(f.body)}</p>
    ${sessionOffer(f.session)}
  </div>`;
}

// ---- переходы ----
function setBackButton(visible){
  if(!tg || !tg.BackButton) return;
  if(visible) tg.BackButton.show(); else tg.BackButton.hide();
}
function showDash(){ disposeAudio(); app.innerHTML = renderDash(); setBackButton(false); window.scrollTo(0,0); }
function showFinal(){ disposeAudio(); app.innerHTML = renderFinal(); startCountdown();
  // Отмечаем показ оффера: по этой отметке бот перестаёт звать вернуться
  // и начинает напоминать про срок цены участника.
  api('/api/offer-seen', {method:'POST'}); setBackButton(true); window.scrollTo(0,0); }
async function openEp(n){
  let r = await api('/api/episode/'+n);
  // Мобильный WebView иногда роняет самый первый запрос после клика молча,
  // без кода ошибки. Один тихий повтор чинит это, не тревожа человека алертом.
  if(r.status===0){ await new Promise(res=>setTimeout(res,600)); r = await api('/api/episode/'+n); }
  if(r.status===402){ STATE.paid=false; showPaywall(); return; }
  if(r.status===403){ tgAlert('Этот эпизод откроется в свой день. Возвращайтесь завтра 🎬'); return; }
  if(r.status!==200){ tgAlert('Не удалось открыть эпизод. Проверьте связь и попробуйте ещё раз.'); return; }
  disposeAudio(); app.innerHTML = renderEp(r.data); setBackButton(true); window.scrollTo(0,0);
  if(r.data.audio) loadEpisodeAudio(n);
}
function celebrateWall(prev, cur){
  const total=40, prevLit=Math.round((prev/5)*total), curLit=Math.round((cur/5)*total);
  let cells=''; for(let i=0;i<total;i++){
    if(i<prevLit) cells+=`<div class="tv on"></div>`;
    else if(i<curLit) cells+=`<div class="tv on lightup" style="animation-delay:${((i-prevLit)*0.05).toFixed(2)}s"></div>`;
    else cells+=`<div class="tv"></div>`;
  }
  const pct=Math.round((cur/5)*100);
  return `<div class="wall-wrap"><div class="wall-top"><span class="lbl">// ваша узнаваемость</span>
    <span class="rating">${pct}% <small>эфира</small></span></div><div class="tvgrid">${cells}</div></div>`;
}
function renderCelebrate(ep, prev, cur){
  const isFinal = ep>=5, badge = (STATE.episodes.find(e=>e.n===ep)||{}).badge || '';
  // Человек только что получил результат бесплатного эпизода. Здесь он решает,
  // идти ли дальше, поэтому вместо «Дальше» стоит предложение остальных эпизодов.
  const free = !STATE.paid;
  const p = STATE.paywall;
  return `<div class="screen on"><div class="celebrate">
    <div class="cel-cap">${isFinal?'// премьера':'// эпизод '+ep+' в эфире'}</div>
    ${celebrateWall(prev, cur)}
    <div class="cel-badge">${esc(badge)}</div>
    <p class="cel-line">${esc(STATE.rating_caps[cur]||'')}</p>
    ${free?`<p class="cel-line" style="font-size:.86rem;opacity:.85">Заявка готова. Дальше зритель, заходы, профиль и план на месяц.</p>
      <button class="cta" onclick="buy()">${esc(p.cta)}</button>
      <button class="cta ghost" style="margin-top:10px" onclick="showPaywall()">Сначала посмотреть, что внутри</button>`
      :`<button class="cta" onclick="${isFinal?'showFinal()':'showDash()'}">${isFinal?'Смотреть финал':'Дальше'}</button>`}
  </div></div>`;
}
async function complete(n){
  const btn=document.getElementById('doneBtn'); if(btn){btn.disabled=true;btn.textContent='…';}
  const prev = STATE.recognition;
  const r = await api('/api/episode/'+n+'/done', {method:'POST'});
  if(r.status===200){ STATE=r.data; if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    app.innerHTML = renderCelebrate(n, prev, STATE.recognition); window.scrollTo(0,0); }
  else { if(btn){btn.disabled=false;btn.textContent='Готово ✅';} tgAlert('Не удалось сохранить. Попробуйте ещё раз.'); }
}
// Счета и оплату выставляет бот (см. PAYMENT-SPEC), поэтому часть кнопок уводит в чат.
// Telegram переключает экран не всегда: без этого объяснения человек слышит уведомление
// и не понимает, что произошло, поэтому приложение сначала показывает, куда его ведут.
function handoff(url, title, body){
  disposeAudio();
  app.innerHTML = `<div class="screen on stag">
    ${brandline('переходим в чат с ботом')}
    <div class="eyebrow">// сообщение уже там</div>
    <h1 class="lead">${esc(title)}</h1>
    <p class="sell-reassure" style="margin:14px 0 0">${esc(body)}</p>
    <div style="height:18px"></div>
    <a class="cta" style="display:block;text-align:center;text-decoration:none" href="${url}">Открыть чат с ботом ↗</a>
    <button class="cta ghost" style="margin-top:10px" onclick="showDash()">Вернуться к эпизодам</button>
  </div>`;
  setBackButton(true);
  window.scrollTo(0,0);
  if(tg){ tg.openTelegramLink(url); } else { location.href = url; }
}
function buy(){
  handoff(`https://t.me/${BOT}?start=buy_challenge`, 'Счёт ждёт в чате с ботом',
    'Откройте чат с ботом и оплатите доступ. Приложение обновится само: эпизоды 2–5 станут открытыми.');
}
function promo(){
  handoff(`https://t.me/${BOT}?start=prime_test`, 'Промокод вводится в чате',
    'Откройте чат с ботом и отправьте код одним сообщением по формату /promo ВАШКОД.');
}
function checkup(){
  handoff(`https://t.me/${BOT}?start=checkup`, 'Подробности в чате с ботом',
    'Открываю чат: там описание и следующий шаг.');
}
function session(){
  handoff(`https://t.me/${BOT}?start=session`, 'Запись на сессию — в чате с ботом',
    'Открываю чат: там свободные слоты и подтверждение времени.');
}
function feedbackReview(n){
  handoff(`https://t.me/${BOT}?start=fb_${n}`, 'Счёт на разбор ждёт в чате',
    `Откройте чат с ботом: там счёт за разбор эпизода ${n}. После оплаты пришлёте туда же свою работу.`);
}
function tgAlert(m){ if(tg&&tg.showAlert){ tg.showAlert(m); } else { alert(m); } }

// ---- старт ----
async function boot(){
  try{ if(tg){ tg.ready(); tg.expand(); if(tg.BackButton){ tg.BackButton.onClick(showDash); } } }catch(e){}
  if(!INIT){ screenBoot('Откройте приложение через бота @'+BOT+' — первый эпизод открыт всем.', false); return; }
  const r = await api('/api/state');
  if(r.status===401){ screenBoot('Сессия не подтвердилась. Откройте приложение заново через бота.', false); return; }
  if(r.status!==200 || !r.data){ screenBoot('Сервис временно недоступен. Попробуйте чуть позже.', false); return; }
  STATE = r.data;
  showDash();
}
boot();
</script>
