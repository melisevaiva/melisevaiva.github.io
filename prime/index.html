<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Я в прайме</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;900&family=Rubik:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="screen on" style="padding-top:80px;text-align:center">
    <div class="mark" style="margin:0 auto 16px">Ю</div>
    <p class="cmt">// загружаем ваш сезон…</p>
  </div>
</div>

<script>
const BOT = "marketing_check_up_quiz_bot";
// База API (VPS). Витрина на GitHub Pages → fetch сюда (CORS на бэкенде).
// Постоянный адрес API: при следующей смене IP менять приложение не потребуется.
const API_BASE = "https://api.juliana-loginova.ru:8443";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const INIT = tg ? tg.initData : "";
const app = document.getElementById('app');
const esc = s => (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;');
let STATE = null;

async function api(path, opts){
  opts = opts || {};
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 12000);
  opts.headers = Object.assign({'Authorization':'tma '+INIT}, opts.headers||{});
  opts.signal = controller.signal;
  try{
    const r = await fetch(API_BASE + path, opts);
    return { status:r.status, data: r.status!==204 ? await r.json().catch(()=>null) : null };
  }catch(e){
    return { status:0, data:null };
  }finally{
    clearTimeout(timeout);
  }
}

function brandline(right){
  return `<div class="brandline"><div class="mark">Ю</div>
    <div><div class="u" style="font-size:.72rem;letter-spacing:.04em">Юлиана Логинова</div></div>
    <div class="cmt">// ${right||'я в прайме'}</div></div>`;
}
function tvWall(count, capOverride, subOverride){
  const caps = STATE.rating_caps, total=40, lit=Math.round((count/5)*total), pct=Math.round((count/5)*100);
  let cells=''; for(let i=0;i<total;i++) cells+=`<div class="tv ${i<lit?'on':''}"></div>`;
  return `<div class="wall-wrap">
    <div class="wall-top"><span class="lbl">// ваша узнаваемость</span>
      <span class="rating">${pct}% <small>эфира</small></span></div>
    <div class="tvgrid">${cells}</div>
    <div class="wall-cap">${esc(capOverride || caps[count])}<span class="cmt">${esc(subOverride || (count+' из 5 в эфире'))}</span></div>
  </div>`;
}

function screenBoot(msg, demo){
  app.innerHTML = `<div class="screen on stag" style="padding-top:64px">
    ${brandline()}
    <h1 class="lead">Я в<span class="red">прайме</span></h1>
    <p class="sell-promise" style="margin:12px 0 6px">5 дней — и ваш блог собран так, что вас начинают замечать.</p>
    <p style="margin:6px 0 18px;color:var(--grey)">${esc(msg)}</p>
    <a class="cta" href="https://t.me/${BOT}" target="_blank" rel="noopener">Открыть в Telegram</a>
    ${demo?`<a class="cta ghost" style="margin-top:10px" href="preview.html">Посмотреть демо</a>`:''}
  </div>`;
}

function renderPaywall(){
  const p = STATE.paywall;
  return `<div class="screen on stag">
    ${brandline()}
    ${p.urgency?`<div class="urgency">${esc(p.urgency)}</div>`:''}
    <div class="eyebrow">${esc(p.kicker)}</div>
    <h1 class="lead">${esc(p.title_top)}<span class="red">${esc(p.title_red)}</span></h1>
    <p class="sell-pain">${esc(p.pain)}</p>
    <p class="sell-promise">${esc(p.promise)}</p>
    <div class="sell-h">${esc(p.get_title)}</div>
    <ul class="get-list">${(p.get||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
    ${p.not_line?`<p class="sell-reassure">${esc(p.not_line)}</p>`:''}
    <div class="proof-card"><div class="proof-h">${esc(p.proof_title)}</div>${esc(p.proof)}</div>
    ${p.example_title?`<div class="example-card">
      <div class="sell-h">${esc(p.example_title)}</div>
      <div class="example-before">${esc(p.example_before)}</div>
      <div class="example-arrow">↓</div>
      <div class="example-after">${esc(p.example_after)}</div>
      <p>${esc(p.example_note||'')}</p>
    </div>`:''}
    ${tvWall(5, p.wall_caption, 'прайм-тайм')}
    <div class="sell-h">${esc(p.episodes_title)}</div>
    ${p.episodes_line?`<p class="episodes-line">${esc(p.episodes_line)}</p>`:''}
    ${p.price_anchor?`<p class="price-anchor">${esc(p.price_anchor)}</p>`:''}
    <p class="sell-reassure">${esc(p.reassure)}</p>
    <div class="sticky-cta"><button class="cta" onclick="buy()">${esc(p.cta)}</button>
      ${p.promo_cta?`<button class="promo-link" onclick="promo()">${esc(p.promo_cta)}</button>`:''}
      <span class="sc-note">${esc(p.cta_reassure||p.cta_note||'')}</span></div>
  </div>`;
}

function renderDash(){
  const done = new Set(STATE.progress.map(p=>p.day));
  const unlocked = STATE.unlocked_day, rec = STATE.recognition;
  return `<div class="screen on stag">
    ${brandline('добро пожаловать на кастинг')}
    <div class="eyebrow">// кастинг · ${rec>=5?'финал':'этап '+(Math.min(unlocked,5))+' из 5'}</div>
    <h1 class="lead">${esc(STATE.name)||'Привет'}, <span class="red">вас начинают замечать</span></h1>
    ${tvWall(rec)}
    ${rec<5?`<p class="sell-reassure" style="margin:12px 0 0;font-size:.82rem">Новый эпизод открывается каждый день — заходите утром.</p>`:''}
    <div style="height:8px"></div>
    ${STATE.episodes.map(e=>{
      const st = done.has(e.n) ? 'done' : (e.n<=unlocked ? 'now' : 'lock');
      let flag = st==='done'?'в эфире ✓':(st==='now'?'открыт':(e.n===unlocked+1?'завтра':'🔒'));
      if(st!=='lock') flag += ' ›';
      const badge = st==='done' ? `<div class="badge-chip">${esc(e.badge)}</div>`:'';
      const click = st==='lock' ? 'disabled' : `onclick="openEp(${e.n})"`;
      return `<button type="button" class="stage ${st}" ${click}>
        <div class="snum">${e.n}</div>
        <div><div class="stagehead"><div class="stitle">${esc(e.tag)}</div></div>
          <div class="sdesc">${esc(e.title)}</div>${badge}</div>
        <div class="sflag">${flag}</div></button>`;
    }).join('')}
    ${rec>=5?`<div style="height:18px"></div><button class="cta" onclick="showFinal()">Смотреть финал</button>`:''}
  </div>`;
}

function renderEp(e){
  return `<div class="screen on stag">
    <button class="back-link" onclick="showDash()" aria-label="Назад к списку эпизодов">← Назад к эпизодам</button>
    ${brandline('эпизод '+e.n+' из 5')}
    <div class="ep-head prose">
      <div class="ep-kicker">// эпизод ${e.n} · ${esc(e.tag)}</div>
      <h1 class="ep-title">${esc(e.title)}</h1>
    </div>
    <div class="prose">
      <p>${esc(STATE.name)||'Привет'}, привет!</p>
      ${(e.prose||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
      ${e.list&&e.list.length?`<ul class="list">${e.list.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
      <div class="taskcard"><div class="th">▶ Задание · 15 минут</div>${esc(e.task)}</div>
      ${(e.after||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
      ${e.sting?`<p class="sting">${esc(e.sting)}</p>`:''}
      ${e.next?`<p class="cmt" style="margin-top:14px">// ${esc(e.next)}</p>`:''}
    </div>
    ${ e.done
      ? `<div class="navrow"><button class="cta ghost" onclick="showDash()">К сезону</button>${e.final?`<button class="cta" onclick="showFinal()">Финал</button>`:''}</div>`
      : `<div style="height:20px"></div><button class="cta" id="doneBtn" onclick="complete(${e.n})">Готово ✅</button>` }
    ${ STATE.feedback && STATE.feedback.cta ? `<div class="fb-up">
      <button class="cta gold" onclick="feedbackReview(${e.n})">${esc(STATE.feedback.cta)}</button>
      <p class="price-note">${esc(STATE.feedback.note||'')}</p></div>` : '' }
  </div>`;
}

function renderFinal(){
  const f = STATE.final;
  return `<div class="screen on stag">
    <button class="back-link" onclick="showDash()" aria-label="Назад к списку эпизодов">← Назад к эпизодам</button>
    ${brandline('финал сезона')}
    <div class="final-badge">${esc(f.badge)}</div>
    <h1 class="lead">${esc(f.title_top)}<span class="red">${esc(f.title_red)}</span></h1>
    ${tvWall(5)}
    <p style="margin:18px 0">${esc(f.body)}</p>
    <p style="margin:6px 0 4px">${esc(f.checkup_lead)}</p>
    <p class="cmt" style="margin:0 0 16px">${esc(f.checkup_note)}</p>
    <button class="cta gold" onclick="checkup()">${esc(f.checkup_cta)}</button>
  </div>`;
}

// ---- переходы ----
function setBackButton(visible){
  if(!tg || !tg.BackButton) return;
  if(visible) tg.BackButton.show(); else tg.BackButton.hide();
}
function showDash(){ app.innerHTML = STATE.paid ? renderDash() : renderPaywall(); setBackButton(false); window.scrollTo(0,0); }
function showFinal(){ app.innerHTML = renderFinal(); setBackButton(true); window.scrollTo(0,0); }
async function openEp(n){
  const r = await api('/api/episode/'+n);
  if(r.status===402){ STATE.paid=false; showDash(); return; }
  if(r.status===403){ tgAlert('Этот эпизод откроется в свой день. Возвращайтесь завтра 🎬'); return; }
  if(r.status!==200){ tgAlert('Не удалось открыть эпизод. Попробуйте позже.'); return; }
  app.innerHTML = renderEp(r.data); setBackButton(true); window.scrollTo(0,0);
}
function celebrateWall(prev, cur){
  const total=40, prevLit=Math.round((prev/5)*total), curLit=Math.round((cur/5)*total);
  let cells=''; for(let i=0;i<total;i++){
    if(i<prevLit) cells+=`<div class="tv on"></div>`;
    else if(i<curLit) cells+=`<div class="tv on lightup" style="animation-delay:${((i-prevLit)*0.05).toFixed(2)}s"></div>`;
    else cells+=`<div class="tv"></div>`;
  }
  const pct=Math.round((cur/5)*100);
  return `<div class="wall-wrap"><div class="wall-top"><span class="lbl">// ваша узнаваемость</span>
    <span class="rating">${pct}% <small>эфира</small></span></div><div class="tvgrid">${cells}</div></div>`;
}
function renderCelebrate(ep, prev, cur){
  const isFinal = ep>=5, badge = (STATE.episodes.find(e=>e.n===ep)||{}).badge || '';
  return `<div class="screen on"><div class="celebrate">
    <div class="cel-cap">${isFinal?'// премьера':'// эпизод '+ep+' в эфире'}</div>
    ${celebrateWall(prev, cur)}
    <div class="cel-badge">${esc(badge)}</div>
    <p class="cel-line">${esc(STATE.rating_caps[cur]||'')}</p>
    <button class="cta" onclick="${isFinal?'showFinal()':'showDash()'}">${isFinal?'Смотреть финал':'Дальше'}</button>
  </div></div>`;
}
async function complete(n){
  const btn=document.getElementById('doneBtn'); if(btn){btn.disabled=true;btn.textContent='…';}
  const prev = STATE.recognition;
  const r = await api('/api/episode/'+n+'/done', {method:'POST'});
  if(r.status===200){ STATE=r.data; if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    app.innerHTML = renderCelebrate(n, prev, STATE.recognition); window.scrollTo(0,0); }
  else { if(btn){btn.disabled=false;btn.textContent='Готово ✅';} tgAlert('Не удалось сохранить. Попробуйте ещё раз.'); }
}
function buy(){
  // счёт выставляет бот (см. PAYMENT-SPEC): открываем бота с триггером покупки
  if(tg){ tg.openTelegramLink(`https://t.me/${BOT}?start=buy_challenge`); tg.close(); }
  else { location.href = `https://t.me/${BOT}?start=buy_challenge`; }
}
function promo(){
  const url=`https://t.me/${BOT}?start=prime_test`;
  if(tg){ tg.openTelegramLink(url); } else { location.href=url; }
}
function checkup(){ const url=`https://t.me/${BOT}?start=checkup`; if(tg){tg.openTelegramLink(url);} else {location.href=url;} }
function feedbackReview(n){ const url=`https://t.me/${BOT}?start=fb_${n}`; if(tg){tg.openTelegramLink(url);} else {location.href=url;} }
function tgAlert(m){ if(tg&&tg.showAlert){ tg.showAlert(m); } else { alert(m); } }

// ---- старт ----
async function boot(){
  try{ if(tg){ tg.ready(); tg.expand(); if(tg.BackButton){ tg.BackButton.onClick(showDash); } } }catch(e){}
  if(!INIT){ screenBoot('Откройте приложение через бота @'+BOT+' после оплаты — тогда откроется ваш сезон.', false); return; }
  const r = await api('/api/state');
  if(r.status===401){ screenBoot('Сессия не подтвердилась. Откройте приложение заново через бота.', false); return; }
  if(r.status!==200 || !r.data){ screenBoot('Сервис временно недоступен. Попробуйте чуть позже.', false); return; }
  STATE = r.data;
  showDash();
}
boot();
</script>
</body>
</html>
